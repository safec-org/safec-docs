# SafeC documentation site — global configuration, read by the SafeC site
# generator in this directory (site/src). Per-locale labels, nav and
# sidebars live in locales/<key>.yaml (one file per entry under 'locales').
# Parsed with std/serial/yaml.

title: SafeC
# Every URL the site emits is prefixed with this (GitHub Pages project site).
# 'serve' overrides it to '/'; 'build --base /x/' does too.
base: /safec-docs/
repo: https://github.com/safec-org/SafeC
# Absolute origin, for sitemap.xml and <link rel="canonical">.
origin: https://safec-org.github.io

# Paths are relative to this file.
source: ..          # markdown root: index.md, guide/, ko/, ...
public: ../public   # copied verbatim to the output root
output: ../dist
theme: theme        # style.css, site.js and the client's site.wasm -> assets/

# Paths under 'source' that are never pages (dot-directories never are).
exclude: [site, public, dist, node_modules, README.md, CLAUDE.md]

# Non-page files linked from pages (public/benchmarks/*.sc, ...): links
# with these extensions are left alone instead of getting '.html'.
file_extensions: [sc, scx, h, c, cpp, hpp, cc, cuh, go, py, rs, zig, toml, lock, sh, metal, cu, hip, cl, wgsl, mod, sum, md, txt, json, in, xml]

# Trees build.sh generates before the generator runs, copied into the
# output: the std API reference ('safeguard doc --std', safec-doc) at /api/.
# Absent (an older SafeC without 'safeguard doc'), they are skipped and
# links to them fail the link check.
generated:
  - {from: build/api, to: api}

# Root locale first. 'key' names locales/<key>.yaml; the locale's URL
# prefix and its markdown subdirectory come from that file's 'prefix'.
locales:
  - key: en
  - key: ko

head:
  - {tag: link, rel: icon, type: image/x-icon, href: favicon.ico}
  - {tag: link, rel: icon, type: image/png, sizes: 32x32, href: favicon-32x32.png}
  - {tag: link, rel: icon, type: image/png, sizes: 16x16, href: favicon-16x16.png}
  - {tag: link, rel: apple-touch-icon, href: apple-touch-icon.png}
  - {tag: link, rel: manifest, href: site.webmanifest}

# The blog (site/src/blog.sc): posts per index page.
blog:
  per_page: 10

# Alias and moved URLs. GitHub Pages has no server redirects, so each
# 'from' gets a static page forwarding to 'to' (main.sc). 'to' must be a
# page; 'from' must not be one. Every URL the site ever served stays a
# page or gets an entry here.
redirects:
  - {from: /docs/, to: /learn/}
  - {from: /docs, to: /learn/}
  - {from: /learn, to: /learn/}
  - {from: /std/, to: /stdlib/}
  - {from: /download, to: /install}
  - {from: /downloads, to: /install}
  - {from: /releases, to: /blog/tags/release}
  - {from: /news, to: /blog/}
  - {from: /play, to: /playground}
  - {from: /guide/, to: /guide/introduction}
  - {from: /reference/, to: /reference/types}
  - {from: /advanced/, to: /advanced/compiler}
  - {from: /ko/docs/, to: /ko/learn/}
  - {from: /ko/learn, to: /ko/learn/}
  - {from: /ko/download, to: /ko/install}
  - {from: /ko/guide/, to: /ko/guide/introduction}
  - {from: /ko/reference/, to: /ko/reference/types}
  - {from: /ko/advanced/, to: /ko/advanced/compiler}
