name: SafeC site (preview)

# Builds the docs with the SafeC site generator in site/ — the replacement
# for the VitePress build in deploy.yml. Until the switch-over this only
# builds and checks (every internal link and #anchor must resolve), and
# deploys to GitHub Pages only when run by hand with deploy=true.
#
# safec comes from source, not install.sh: the generator relies on std
# features newer than the latest release. SAFEC_REF pins the SafeC commit
# (or branch/tag); the toolchain build is cached per resolved commit, so
# only a SafeC change pays for the compiler build. Once a release carries
# everything the generator needs, this becomes install.sh --version=<tag>
# (plus lld for wasm-ld).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated site to GitHub Pages
        type: boolean
        default: false
      safec_ref:
        description: SafeC commit, branch or tag to build the generator with
        default: main

permissions:
  contents: read

env:
  LLVM_VERSION: "21"
  SAFEC_REF: ${{ inputs.safec_ref || 'main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SafeC commit
        id: safec
        run: |
          sha=$(git ls-remote https://github.com/safec-org/SafeC "$SAFEC_REF" | head -1 | cut -f1)
          echo "sha=${sha:-$SAFEC_REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: safec-org/SafeC
          ref: ${{ steps.safec.outputs.sha }}
          path: SafeC

      - name: Install LLVM ${{ env.LLVM_VERSION }} (clang, wasm-ld)
        run: |
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
          echo "SAFEC_CLANG=clang-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "SAFEC_CLANGXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"

      - name: Cache SafeC toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            SafeC/compiler/build/safec
            SafeC/safeguard/build/safeguard
          key: safec-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ steps.safec.outputs.sha }}

      - name: Build safec + safeguard
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja -S SafeC/compiler -B SafeC/compiler/build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
          cmake --build SafeC/compiler/build
          cmake -G Ninja -S SafeC/safeguard -B SafeC/safeguard/build -DCMAKE_BUILD_TYPE=Release
          cmake --build SafeC/safeguard/build

      - name: Toolchain on PATH
        run: |
          echo "$GITHUB_WORKSPACE/SafeC/compiler/build" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/SafeC/safeguard/build" >> "$GITHUB_PATH"
          echo "SAFEC_HOME=$GITHUB_WORKSPACE/SafeC" >> "$GITHUB_ENV"

      - name: Build the wasm client
        working-directory: site/client
        run: |
          safeguard build --release --target wasm32
          cp build/site-client ../theme/site.wasm

      - name: Build the site (fails on dead links)
        working-directory: site
        run: |
          safeguard build --release
          ./build/safec-site check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
